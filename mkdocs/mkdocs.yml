site_name: Legendary Missions Documentation
copyright: "An Artemis: Cosmos mission"
extra:
  generator: false
  social:
    - icon: fontawesome/solid/cart-shopping
      link: https://www.artemisspaceshipbridge.com/
    - icon: fontawesome/brands/youtube 
      link: https://www.youtube.com/@ArtemisSbs
    - icon: fontawesome/brands/steam 
      link: https://store.steampowered.com/app/2467840/Artemis_Cosmos/
    - icon: material/forum
      link: https://artemis.forumchitchat.com/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    #- navigation.footer
  custom_dir: overrides
  icon: 
    #logo: material/castle
    logo: mast/icon
    #admonition:
      # note: mast/icon
      # # note: simple/windowsterminal
      # mast: mast/icon
      # python: simple/python
      # abstract: octicons/checklist-16
      # info: octicons/info-16
      # tip: octicons/squirrel-16
      # success: octicons/check-16
      # question: octicons/question-16
      # warning: octicons/alert-16
      # failure: octicons/x-circle-16
      # danger: octicons/zap-16
      # bug: octicons/bug-16
      #example: octicons/beaker-16
      #quote: octicons/quote-16

repo_url: https://github.com/artemis-sbs/LegendaryMissions
repo_name: artemis-sbs/LegendaryMissions

nav:
  - Home: index.md

  - Playing:
    - playing/index.md
    - Game features: playing/features.md
    - Multiplayer jobs (co-op & competitive): playing/multiplayer-quests.md
    - Items & upgrades: playing/items.md
    - How to play the Casino: playing/casino.md
    - Updating: playing/updating.md

  - Hosting:
    - hosting/index.md
    - Settings: hosting/settings.yaml.md
    - Profiles: hosting/profiles.md

  - Addons:
    - addons/index.md
    - The Casino: addons/casino.md
    - BioMech: addons/biomech.md
    - Fabrication & Beacons: addons/fabrication.md
    - Avatar Editor: addons/avatar.md
    - Maps & terrain: script/maps/index.md
    - Writing a Siege boss: script/bosses.md

  # BEGIN generated records nav
  - The mission data:
    - records/index.md
    - Casino:
      - "The casino bar": records/casino/bar.md
    - Comms:
      - "Raider hails": records/comms/raider_hails.md
    - Documents:
      - "Console help": records/documents/help_docs.md
    - Fabrication:
      - "Fabricator Recipes": records/fabrication/recipes.md
    - Hangar Sorties:
      - "Hangar Quests": records/hangar_sorties/hangar_quests.md
    - Lm Lore:
      - "A Zunok's Galactic Helpfile": records/lm_lore/library_docs.md
    - Maps:
      - "The three sides": records/maps/sides.md
      - "Siege Quests": records/maps/siege_quests.md
    - Bosses:
      - "Continuous": records/maps/bosses/continuous.md
      - "Infestation": records/maps/bosses/infestation.md
      - "Ragnarok": records/maps/bosses/ragnarok.md
      - "Warlord": records/maps/bosses/warlord.md
    - Peacetime Remastered:
      - "Peacetime Remastered": records/maps/peacetime_remastered/index.md
      - "Florbin Case": records/maps/peacetime_remastered/florbin-case.md
      - "Jobs": records/maps/peacetime_remastered/jobs.md
      - "Scans": records/maps/peacetime_remastered/scans.md
      - "Drops": records/maps/peacetime_remastered/drops.md
      - "Landmarks": records/maps/peacetime_remastered/landmarks.md
      - "Cargo Scans": records/maps/peacetime_remastered/cargo-scans.md
      - "Cast": records/maps/peacetime_remastered/cast.md
      - "Voices": records/maps/peacetime_remastered/pr-voices.md
      - "Florbin Text": records/maps/peacetime_remastered/florbin-text.md
      - "Florbin Clues": records/maps/peacetime_remastered/florbin-clues.md
    - Quests:
      - "Bridge Stories": records/quests/bridge_stories.md
  # END generated records nav

  - About:
    - about/index.md


markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".."]

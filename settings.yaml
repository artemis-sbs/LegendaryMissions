
# Auto start will automatically start the mission when it is selected
AUTO_START: false

# Come back on this screen with the settings the LAST game started with, instead of the
# ones below. Remembered per mission and per map, and it carries the crew's ship names and
# hulls too. Saved when a game STARTS, so a crash or a quit still leaves it recorded.
#
# Commented out deliberately, and that IS the setting: the library default is false, and a
# key present here is explicit, so uncommenting "false" would stop a mod built on
# LegendaryMissions from ever turning it on. Uncomment to pin it either way.
#
# Off suits a venue or convention machine - every group starts from the same known state.
# On suits a crew replaying the same setup after an early death.
#RESTORE_LAST_SETUP: false

# Auto play is a special mode
# Typically used for testing
# But could be useful with
# attracting attention
AUTO_PLAY:
    enable: false
    # Range (u) the ship holds at to open with its EMP/Nuke volley, clear of the blast.
    standoff: 5000
    # Engineering overpower applied to drive + weapons (1.0 = 100%); eased off on low energy.
    overpower: 1.5

#
# Operator mode is for operators
# It allows the main screen to display and image
# and remote starting of the game
#
OPERATOR_MODE:
    enable: false
    logo: "media/LegendaryMissions/operator"
    show_logo_on_main: true
    pin: "000000"

#
# Additional Lock down settings
#
SHIP_PICK_READ_ONLY: false
CAN_CHANGE_CONSOLE: true

### Very rough prototype of a comms interaction change 
# COMMS_PROTOTYPE: true
# ALLOW_CONSOLE_TABS: true

# Use Brain based Damcons
# This is a temporary setting 
# The old version will be removed
# after further play testing
NEW_DAMCONS: true

GAMEMASTER: 
    enable: true
    beta: false
    menu_icon_size: 45 # Pixels
### Uncomment the pin if you want the 
###Gamemaster to require a pin
    #pin: "000000"
#
# These are the settings 
# for standard docking
#    
DOCKING: 
    refuel_amount: 20
    refuel_delay: 2
    shield_delay: 2
    shield_coeff: 2
    torps_delay: 6
    interior_delay: 2
    interior_count: 2
    # Gas giant orbit. Not a refit - shields only, and slowly.
    giant_shield_delay: 6
    giant_shield_coeff: 0.5
    giant_orbit_speed: 120

# Color theme for engineering
# see grid_theme.json
GRID_THEME: 0

DIFFICULTY: 5

WORLD_SELECT: "siege"

TERRAIN_SELECT: "some"
LETHAL_SELECT: "none"
FRIENDLY_SELECT: "few"
MONSTER_SELECT: "few"
# Non-Typhon creatures - Piranha, Shark, Dragon, Charybdis and Insect, the five that ride
# a real ship hull instead of the classic Typhon geometry. false = they never spawn, from
# any source: no wreck nests, and the GM bestiary menu stops offering them. The eight
# Typhon-style species (Typhon, Reaver, Grazer, Ravener, Bulwark, Sparkfeeder, Siphon
# Leech, Warden) are unaffected, and MONSTER_SELECT still sets how many a map seeds.
#
# OPT-IN AS OF 2026-08-25, pending a real fix. Set false here, and matched in
# prefabs/__init__.mast and consoles/server_console.mast so all three agree.
#
# WHY: a render-side BREAKPOINT (0x80000003 - an assertion, not an access violation) in
#   RenderManager::GetDrawData -> ObjectTypeDrawData -> MeshSilhouette -> Ribbon3DManager
# killed a server eight minutes into a siege. The only monster art root anywhere in that
# dump's memory was `ships/monster2` - the Piranha - beside `behav_monster` and the
# monster body-bend/wiggle blob documentation strings. monster2 is also the only monster
# with a .paxmesh and split _body/_jaw geometry, and its body is procedurally deformed
# while turning, so it exercises a silhouette path the single-mesh species never touch.
#
# This is BROADER than the suspect - there is no per-species switch today, and a
# Piranha-only one would need a new MONSTER_PIRANHA guarded in prefabs/piranha.mast and
# damage/destroy.mast. Turning the whole family off is the conservative move until the
# mesh is understood: a host who wants them back sets this true.
MONSTER_NON_TYPHON: false
UPGRADE_SELECT: "lots"

# Music bank. Deliberately COMMENTED OUT, and that is the setting: a key present here is
# explicit, so it outranks any mod's `settings_set_mod_default` - uncommenting this stops
# every mod built on LegendaryMissions from ever supplying its own soundtrack. The library
# default is "random", which picks from whatever @media/music labels are loaded. Uncomment
# only to pin one deliberately; the operator can still change it on the server console.
#MUSIC_SELECT: "random"
GAME_TIME_LIMIT: 0
WAR_TIME_DELAY: 10


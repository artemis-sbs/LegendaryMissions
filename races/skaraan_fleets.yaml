# Skaraan raiding fleets, by difficulty.
#
# Eleven tiers, five variants each; a variant is the ship keys that make up one
# fleet. Loaded by this race's addon when the race is in the NPC_RACES setting.
#
# Moved out of LegendaryMissions/fleets/map_common.py, where six of these lived as
# Python literals behind an if/elif chain that no mod could extend.

# The generated documentation must not fall behind the .amd files it came from.
#
# Everything under mkdocs/docs/records/ and every `<!-- amd:begin ... -->` block in a
# hand-written page is produced by `sbs site`, so regeneration is something a person
# has to REMEMBER - which is the failure the generator replaced. One hand-copied
# example had drifted far enough to teach `When:` as the completion trigger when it is
# an alias of `Starts when:`, the START one, so a quest written from the documentation
# armed and then never completed.
#
# `--check` writes nothing and exits non-zero if anything would change.
name: Docs are current

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The tool resolves sbs_utils relative to the MISSION'S PARENT, so the three
      # repos have to sit side by side the way they do on a developer's machine.
      - uses: actions/checkout@v4
        with:
          path: missions/LegendaryMissions

      - uses: actions/checkout@v4
        with:
          repository: artemis-sbs/sbs_utils
          ref: v1.4.0_dev
          path: missions/sbs_utils

      # sbs_cli releases from `main` - it has no v1.4.0_dev branch, and naming one
      # here makes the checkout 404 rather than fail with anything readable.
      - uses: actions/checkout@v4
        with:
          repository: artemis-sbs/sbs_cli
          path: missions/sbs_cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the CLI's dependencies
        run: pip install -r missions/sbs_cli/requirements.txt

      # No Cosmos install here, so no race atlases - and that is fine. A face PNG is
      # named from its spec, so one that has been composited and committed resolves
      # without ever opening an atlas. Only a NEW face needs one, and failing on that
      # is correct: nobody has produced that art yet.
      - name: Generated documentation is current
        run: python missions/LegendaryMissions/.github/check_docs.py

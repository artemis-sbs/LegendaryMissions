# Turret hulls, declared to the ENGINE through ship_data_merge_mod (turret_ships.py).
#
# WHY THIS FILE IS LOAD-BEARING, not cosmetic. Engine-measured on 1.3.5
# (LM_TestRange/maps/test_turret_probe.mast -> turret_probe.txt): a `behav_station`
# object fires its beams ONLY when its hull was declared by an add-on this way. The
# identical target_shoot() call against stock `starbase_command` and stock
# `tsn_light_cruiser` produced ZERO hits; two add-on hulls produced 12 each. So a turret
# cannot reuse a stock starbase art - it must spawn one of these.
#
# EVERY ENTRY IS COMPLETE ON PURPOSE. A hull missing `hull_port_sets` or `torpedostart`
# has crashed the engine at load (mkdocs/docs/build/making-a-mod.md). Copy a whole entry
# and edit it; never trim one down to "just the fields that differ".
#
# BEAM STATS ARE FIXED AT THE HULL. `beamRange`/`beamCount`/`beamDamage` are not readable
# or writable on a live object in the engine (they exist only in the mock and on mod
# hulls, where sbs_utils wrote them). So a turret variant that needs different beams needs
# a NEW ENTRY HERE - there is no per-object tuning. Keep each entry's beam `range` in step
# with the `range:` the prefab passes to turret_make(), or a turret will acquire targets
# it cannot reach and sit there not firing.
#
# `roles` is deliberately "turret" and NOT "station": the art's roles are applied at spawn,
# and inheriting `station` would drag in LM docking, market, repair, nav proxies and every
# "protect the station" objective in the game.

# The engine parses this as HJSON, NOT YAML: keys cannot contain whitespace and there
# are no block sequences, so a `- key:` list or a `"beam Primary Beams":` block mapping
# is a parse error - and one the engine reports to NOBODY. add_extra_ship_data raises,
# the library still merges the file with PyYAML, and the hulls then exist everywhere
# except the engine: turrets spawn and never fire. Keep this file JSON-shaped.

{
  "#ship-list": [


# LegendaryMissions with TNG ART on the NPCs and stations - and LM's own diplomacy intact.
#
#   python -m cosmos_dev.mission_runner . --test 30 --map 0 --profile tng_art
#   Artemis3-x64-release.exe autostartserver defaultmission=LegendaryMissions profile=tng_art
#
# WHY THIS EXISTS AND `tng_reskin` DOES NOT DO IT. The reskin declares TNG art against the
# GAME'S OWN ship keys, which works on the server and never on a client: a client resolves a
# key it already knows against its own data/shipData.yaml, so its stock artfileroot wins and
# the override never crosses the wire. That is why the player ship came out Trek (its key is
# `tng_*`, which the client has no record for, so it renders what the server sends) while
# every NPC and station came out stock TSN.
#
# This profile instead points the ship-data LOOKUP at the mod's OWN keys. The client has no
# local record for those either, so it renders the mod art - the same route that already
# works for the player ship.
#
# NOTHING HERE CHANGES A SIDE. `RACE_ART` maps the faction hulls are CHOSEN FROM; the side a
# ship spawns on - and therefore relations, comms and contact colour - is `side_value`, which
# the prefabs keep as a separate variable and this does not touch. LM's raiders are still
# raiders, they just fly Cardassian hulls. Faces are unaffected too: they come from `crew`,
# which is resolved before the art mapping.
addons:
    include:
        - tng_races

media:
    include:
        - Cosmos-TNG-Mod.media

# LM race -> the shipData faction its hulls are drawn from. A race with no entry is left
# alone, and an entry whose faction has no hull for the role being spawned is ignored rather
# than obeyed - spawning nothing is far harder to notice than wrong art.
RACE_ART:
    kralien:  Cardassian
    torgoth:  Klingon
    arvonian: Romulan
    ximni:    Dominion
    skaraan:  Breen
    pirate:   Orion
    tsn:      Federation
    civ:      Federation

# The OTHER way a hull gets chosen: named outright, by key. Fleet ladders do this (so a
# wave keeps its shape) and so do stations. Those never reach RACE_ART, so they get a key
# map instead. Generated from the stock->TNG mapping in Cosmos-TNG-Mod/_build_from_zip.py,
# which is where that correspondence is recorded once.
ART_KEYS:

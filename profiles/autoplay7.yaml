
# Auto start will automatically start the mission when it is selected
AUTO_START: true

# Auto play is a special mode
# Typically used for testing
# But could be useful with
# attracting attention
AUTO_PLAY:
    enable: true
    # Range (u) the ship holds at to open with its EMP/Nuke volley, clear of the blast.
    standoff: 5000
    # Engineering overpower applied to drive + weapons (1.0 = 100%); eased off on low energy.
    overpower: 1.5


#
# These are the settings 
# for standard docking
#    
DOCKING: 
    refuel_amount: 20
    refuel_delay: 2
    shield_delay: 2
    shield_coeff: 2
    torps_delay: 6
    interior_delay: 2
    interior_count: 2

# Color theme for engineering
# see grid_theme.json
GRID_THEME: 0

DIFFICULTY: 7

WORLD_SELECT: "siege"

TERRAIN_SELECT: "some"
LETHAL_SELECT: "none"
FRIENDLY_SELECT: "few"
MONSTER_SELECT: "few"
# Stated explicitly, though it now MATCHES the default - see settings.yaml for why the
# non-Typhon family is opt-in. An unattended soak should say what it is running rather
# than inherit it, and if the default goes back to true this profile stays quiet.
MONSTER_NON_TYPHON: false
UPGRADE_SELECT: "lots"
GAME_TIME_LIMIT: 0
WAR_TIME_DELAY: 10

# Player related settings
PLAYER_CREATE_DEFAULT: true
PLAYER_COUNT: 6
PLAYER_SHIP_RESPAWN: false

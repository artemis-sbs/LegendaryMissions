# Ship mass, for the grav-tether constraints layer.
#
# WHY A TABLE AND NOT A DERIVATION. shipData has no mass field, and the obvious proxies
# do not order ships correctly: `exclusionradius` puts a fighter and a shuttle both at 25
# and a light cruiser, a battleship and a juggernaut all at 50. `hullpoints` DOES order
# them (1 / 1 / 3 / 5 / 9, stations 100-200), so it seeds this file - but mass is not
# toughness, and the entries marked "hauler" are where that shows: a freighter is a barn
# door with a cargo hold, heavy to drag and trivial to shoot.
#
# UNITS ARE RELATIVE. A fighter is 1. Only RATIOS matter: the tether compares the two
# ends, so doubling every number here changes nothing.
#
# A hull not listed falls back to LM_TETHER_MASS_DEFAULT and is LOGGED once - a silent
# fallback is how "everything weighs the same" hides. Add the hull here rather than
# letting the warning repeat.

masses:
  # ANCHORS. Nothing should ever reach the mass rule with one of these - the library
  # refuses to pull an ANCHOR_ROLES body at all - but if a mission clears that rule, a
  # reversal is the behavior you want: grab a black hole and it drags YOU. Listing them
  # also silences the once-per-hull "no tether mass for hull 'maelstrom'" warning this
  # bug has been logging since the tether shipped.
  maelstrom: 100000       # black hole
  planet: 100000
  arvonian_carrier: 5
  arvonian_destroyer: 2
  arvonian_fighter: 1
  arvonian_light_carrier: 4
  biomech_a: 2
  biomech_b: 2
  biomech_c: 2
  biomech_d: 2
  cargo_ship: 12          # hauler - bulk, not toughness
